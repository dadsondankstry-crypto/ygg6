name: Gerar APK - Guardiao de Dados

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # O runner ubuntu-24.04 ja inclui o Android SDK 35 e build-tools 35.
      # Evitamos setup-android/sdkmanager, que falhou no workflow anterior.
      - name: Usar Android SDK ja instalado no GitHub
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            echo "::error::Android SDK Platform 35 nao esta instalado em $SDK"
            ls -la "$SDK/platforms" || true
            exit 1
          fi
          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "::error::Android Build Tools 35.0.0 nao esta instalado em $SDK"
            ls -la "$SDK/build-tools" || true
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "SDK Android 35 e Build Tools 35.0.0 encontrados."
          java -version

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardiao-de-Dados-v3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
